site_name: Axiolock
site_description: Documentation for the Axiolock Python library.
site_url: https://axiolock.github.io
repo_url: https://github.com/axiolock/axiolock
repo_name: axiolock/axiolock
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  favicon: https://raw.githubusercontent.com/axiolock/axiolock/main/media/gear_icon.png
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
  palette:
    scheme: slate
    primary: grey
    accent: blue

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts: concepts.md
  - Reference: reference.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/axiolock/axiolock

copyright: Copyright &copy; 2026 Axiolock
